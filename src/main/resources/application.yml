server:
  port: 8081

spring:
  application:
    name: ms-barriodigital-requests
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USER:barriodigital_requests}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

barriodigital:
  catalog:
    base-url: ${MS_CATALOG_URL:http://localhost:8082}
  security:
    issuer-uri: ${AAD_ISSUER_URI:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      # tokens v2.0 traen aud = GUID; v1.0 traen aud = api://GUID. Aceptar ambos.
      - ${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
      - api://${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    required-scope: ${AAD_REQUIRED_SCOPE:access_as_user}

management:
  endpoints:
    web:
      exposure:
        include: health
